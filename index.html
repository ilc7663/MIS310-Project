<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Understanding Your Digital Footprint</title>
        <style>
            :root {
                --sage: #9aad8b;
                --sage-deep: #5e7057;
                --khaki: #d7d0a8;
                --cream: #f4f1e8;
                --text: #2d3a2f;
                --navy: #2d3a2f;
            }

            body {
                margin: 0;
                font-family: "Century Gothic", "Trebuchet MS", sans-serif;
                background: linear-gradient(135deg, var(--cream), var(--khaki));
                color: var(--text);
                line-height: 1.7;
            }

            nav {
                background: var(--sage-deep);
                padding: 18px 24px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }

            nav a {
                color: #ffffff;
                text-decoration: none;
                margin-right: 18px;
                font-weight: bold;
            }

            main {
                max-width: 900px;
                margin: 60px auto;
                padding: 0 20px;
            }

            .card {
                background: rgba(255, 255, 255, 0.75);
                border-radius: 16px;
                box-shadow: 0 6px 18px rgba(46, 60, 47, 0.12);
                padding: 40px 32px;
                text-align: center;
            }

            h1 {
                color: var(--navy);
                text-align: center;
                font-size: 3rem;
                font-weight: bold;
                margin-bottom: 12px;
            }

            p {
                color: var(--text);
                text-align: center;
                font-size: 1.4rem;
                margin: 0;
            }

            .subheading {
                margin-top: 8px;
                color: var(--sage-deep);
                font-weight: 600;
            }

            .hero-intro {
                max-width: 680px;
                margin: 0 auto 28px;
                font-size: 1.15rem;
            }

            .cta-button {
                display: inline-block;
                padding: 12px 22px;
                border-radius: 8px;
                background: var(--sage-deep);
                color: #ffffff;
                text-decoration: none;
                font-size: 1rem;
                font-weight: bold;
                transition: background-color 0.2s ease, transform 0.2s ease;
            }

            .cta-button:hover {
                background: var(--text);
                transform: translateY(-2px);
            }
        </style>
    </head>
    <body>
        <nav>
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="education.html">Education</a>
          <a href="faq.html">FAQ</a>
        </nav>

        <main>
            <div class="card">
                <h1>Understanding Your Digital Footprint</h1>
                <p class="hero-intro">Your online activity creates a lasting picture of who you are. Learn what makes up your digital footprint, how it can affect your future, and what you can do to manage it.</p>
                <a class="cta-button" href="education.html">Learn About Digital Footprints</a>
            </div>
        </main>
    </body>
</html>
