        <title>Understanding Your Digital Footprint</title>
        <style>
            :root {
                --sage: #9aad8b;
                --sage-deep: #5e7057;
                --khaki: #d7d0a8;
                --cream: #f4f1e8;
                --text: #2d3a2f;
                --navy: #2d3a2f;
            }

            body {
                margin: 0;
                font-family: "Century Gothic", "Trebuchet MS", sans-serif;

                color: var(--text);
                line-height: 1.7;
            }

            nav {
                background: var(--sage-deep);
                padding: 18px 24px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }

            nav a {
                color: #ffffff;
                text-decoration: none;
                margin-right: 18px;
                font-weight: bold;
            }

            main {
                max-width: 900px;
                margin: 60px auto;
                padding: 0 20px;
            }

            .card {
                background: rgba(255, 255, 255, 0.75);
                border-radius: 16px;
                box-shadow: 0 6px 18px rgba(46, 60, 47, 0.12);
                padding: 40px 32px;
                text-align: center;
            }

            h1 {
                color: var(--navy);
                text-align: center;
                font-size: 3rem;
                font-weight: bold;
                margin-bottom: 12px;
            }

            p {
                color: var(--text);
                text-align: center;
                font-size: 1.4rem;
                margin: 0;
            }

            .subheading {
                margin-top: 8px;
                color: var(--sage-deep);
                font-weight: 600;
            }
